[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4c-robot"
version = "0.1.0"
description = "AI4C PLC and robot-arm domain device package for Uni-Lab-OS"
requires-python = ">=3.11"
dependencies = [
  "opcua>=0.98.13",
  "pandas>=2.0",
]

[project.optional-dependencies]
runtime = [
  "unilabos @ git+https://github.com/Uni-Lab-OS/Uni-Lab-OS.git@7dc4b7470a005857c20559e49e536ecb2381ef81",
]
dev = [
  "build>=1.2",
  "PyYAML>=6.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["ai4c_robot*"]

[tool.setuptools.package-data]
ai4c_robot = [
  "**/*.csv",
  "**/*.json",
  "**/*.yaml",
  "**/*.yml",
  "**/*.xacro",
  "**/*.urdf",
  "**/*.stl",
  "**/*.dae",
  "**/*.obj",
  "**/*.mtl",
  "**/*.gltf",
  "**/*.glb",
  "**/*.png",
  "**/*.jpg",
  "**/*.jpeg",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
